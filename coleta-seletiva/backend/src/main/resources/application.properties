spring.application.name=coleta-seletiva

# PostgreSQL: configure DB_URL, DB_USERNAME e DB_PASSWORD no ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coleta_seletiva}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema.sql cria/atualiza a estrutura; o Hibernate apenas valida os mapeamentos.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
